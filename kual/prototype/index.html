<!DOCTYPE html>
<!--
  知乎 Kindle 阅读器 · PW4 可点击原型
  ================================================================
  用途：评审用。所有文本为虚构示例，不含真实会话、密钥或个人数据。
  运行：直接用浏览器打开本文件即可，无外部依赖、无网络请求。

  规格（可直接转写为原生程序，单位 px，画布 1072 × 1448）
  ----------------------------------------------------------------
  版面     页边距 64 ｜ 正文行长 944（约 26 字）｜ 卡片内边距 40 / 64
  结构     标题栏 140 ｜ 频道栏 128 ｜ 缓存条 96 ｜ 底部操作栏 132 ｜ 阅读设置面板 ≈ 950
  触控     最小 88 × 88 ｜ 主按钮 112 高 ｜ 次按钮 80 高 ｜ 列表整行可点（≥ 200）
  字阶     H1 48/64 Bold ｜ H2 44/62 SemiBold ｜ H3 40/56 SemiBold
           正文 38/68 ｜ 摘要 32/52 ｜ 评论 34/58 ｜ 元信息 24–26/40
  灰阶     #000000 主文字 ｜ #3C3C3C 摘要 ｜ #6E6E6E 元信息 ｜ #9A9A9A 占位
           #C8C8C8 细线 ｜ #EFEFEF 浅底 ｜ #FFFFFF 纸白
  暗黑     底 #000000 ｜ 正文 #EDEDED ｜ 元信息 #9E9E9E ｜ 细线 #3A3A3A ｜ 浅底 #141414
           暗黑下主按钮与选中项改为描边，不出现大面积反白
  圆角     仅 0 / 8 / 10 / 12；无投影、无渐变、无动画装饰
  字体     Noto Sans SC（数字与编号用 Inter）

  两个「刷新」严格分开：
    · 刷新内容 / 刷新正文  → 发网络请求，失败保留缓存与位置
    · 清除残影 · 全屏刷新   → 只重绘屏幕，不联网、不改缓存与阅读位置
  ================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知乎阅读 · Kindle PW4 灰阶原型</title>
<style>
/* ============================================================
   Kindle Paperwhite 4 灰阶阅读器 · 可点击原型
   画布 1072 × 1448 ｜ 7 档灰阶 ｜ 无投影 / 无渐变 / 无动画装饰
   ============================================================ */

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#D8D8D8;
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#1A1A1A;overflow:hidden;
}

/* ---------- Mac 侧评审台（不属于设计稿本身） ---------- */
#panel{
  position:fixed;left:28px;top:28px;width:300px;z-index:50;
  background:#F7F7F7;border:1px solid #B9B9B9;padding:22px;
  font-size:13px;line-height:1.6;color:#2B2B2B;
}
#panel h1{font-size:15px;font-weight:700;letter-spacing:.02em;margin-bottom:4px}
#panel .sub{color:#6E6E6E;font-size:12px;margin-bottom:16px}
#panel .grp{border-top:1px solid #CFCFCF;padding-top:12px;margin-top:12px}
#panel .grp-t{font-size:11px;color:#7A7A7A;letter-spacing:.08em;margin-bottom:8px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:7px 0;cursor:pointer;user-select:none}
.sw .track{width:46px;height:24px;border:1px solid #8A8A8A;background:#fff;position:relative;flex:none}
.sw .track i{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#8A8A8A;transition:none}
.sw.on .track{background:#1A1A1A;border-color:#1A1A1A}
.sw.on .track i{left:25px;background:#fff}
#panel .nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
#panel .nav button{
  font:inherit;font-size:12px;padding:6px 9px;border:1px solid #B9B9B9;background:#fff;
  cursor:pointer;color:#2B2B2B;
}
#panel .nav button:hover{background:#EDEDED}
#panel .tip{color:#7A7A7A;font-size:11px;line-height:1.7;margin-top:14px;border-top:1px solid #CFCFCF;padding-top:12px}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-left:300px}
#deviceWrap{position:relative;flex:none}
#device{
  width:1072px;height:1448px;background:#fff;position:relative;overflow:hidden;
  transform-origin:top left;
  box-shadow:0 0 0 1px #9A9A9A, 0 18px 60px rgba(0,0,0,.22);
}

/* ---------- 灰阶 token（挂在设备层，弹层与 toast 同样继承） ---------- */
#device{
  --ink:#000000;          /* 主文字 / 标题 / 选中 */
  --ink-2:#3C3C3C;        /* 摘要 / 正文次级 */
  --ink-3:#6E6E6E;        /* 元信息 / 未选中 */
  --ink-4:#9A9A9A;        /* 占位 / 禁用 */
  --line:#C8C8C8;         /* 细线 */
  --line-strong:#000000;  /* 主分隔线（底栏上边线） */
  --paper:#FFFFFF;
  --paper-2:#EFEFEF;      /* 浅底块 */
  --fs:1;
  --lh:1.79;
  background:var(--paper);color:var(--ink);
}
#device[data-theme="dark"]{
  --ink:#EDEDED;--ink-2:#C9C9C9;--ink-3:#9E9E9E;--ink-4:#6E6E6E;
  --line:#3A3A3A;--line-strong:#8A8A8A;--paper:#000000;--paper-2:#141414;
}
#app{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  overflow:hidden;
}

/* 图标默认尺寸，避免未单独声明的 svg 撑满容器 */
#app svg,#layers svg{width:38px;height:38px;flex:none;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 字阶 ---------- */
.t-h1{font-size:48px;line-height:64px;font-weight:700}
.t-h2{font-size:44px;line-height:62px;font-weight:600}
.t-h3{font-size:40px;line-height:56px;font-weight:600}
.t-body{font-size:38px;line-height:68px;font-weight:400}
.t-ex{font-size:32px;line-height:52px;font-weight:400}
.t-meta{font-size:26px;line-height:40px;font-weight:400}
.t-label{font-size:24px;line-height:40px;font-weight:600}
.num{font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}

/* ---------- 通用骨架 ---------- */
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* 标题栏 140 */
.titlebar{height:140px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 64px;border-bottom:1px solid var(--line)}
.brand{font-size:40px;font-weight:700;letter-spacing:.01em;display:flex;align-items:baseline;gap:14px}
.brand .ver{font-size:24px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.titlebar .right{display:flex;align-items:center;gap:8px}
.iconbtn{
  width:88px;height:88px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;color:var(--ink);cursor:pointer;flex:none;
}
.iconbtn:active{background:var(--paper-2)}
.iconbtn svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.offbadge{font-size:24px;color:var(--ink-3);border:1px solid var(--line);padding:6px 14px;letter-spacing:.04em}
.acctstate{font-size:24px;color:var(--ink-4);letter-spacing:.04em;padding-right:4px}

/* 频道栏 128 —— 选中态只用字重 + 灰度 */
.channels{height:128px;flex:none;display:flex;align-items:center;padding:0 64px;gap:56px;border-bottom:1px solid var(--line)}
.ch{font-size:36px;line-height:48px;font-weight:500;color:var(--ink-3);background:none;border:0;padding:0;cursor:pointer;position:relative;height:128px;display:flex;align-items:center}
.ch.on{color:var(--ink);font-weight:700}
.ch .dot{display:none}

/* 缓存 / 刷新条 96 */
.cachebar{height:96px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 64px;border-bottom:1px solid var(--line);gap:24px}
.cachebar .meta{font-size:26px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghostbtn{
  font:inherit;font-size:26px;font-weight:600;color:var(--ink);background:var(--paper);
  border:1px solid var(--ink);padding:0 28px;height:80px;display:inline-flex;align-items:center;gap:10px;
  cursor:pointer;white-space:nowrap;flex:none;
}
.ghostbtn svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ghostbtn:active{background:var(--paper-2)}
.ghostbtn[disabled]{color:var(--ink-4);border-color:var(--line);cursor:default}

/* 推荐频道：批量翻页 */
.pager{height:104px;flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.pager button{flex:1;background:none;border:0;border-right:1px solid var(--line);font:inherit;font-size:26px;font-weight:600;color:var(--ink);cursor:pointer}
.pager button:last-child{border-right:0}
.pager button:disabled{color:var(--ink-4);cursor:default}
.pager .mid{flex:1.3;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink-3);border-right:1px solid var(--line);letter-spacing:.04em}

/* 提示条 */
.banner{flex:none;padding:26px 64px;border-bottom:1px solid var(--line);background:var(--paper-2);font-size:28px;line-height:44px;color:var(--ink-2);display:flex;gap:18px;align-items:flex-start}
.banner b{font-weight:700;color:var(--ink);white-space:nowrap}
.banner .x{margin-left:auto;background:none;border:0;color:var(--ink-3);font-size:30px;cursor:pointer;padding:0 4px;line-height:1;flex:none}

/* ---------- 列表行 ---------- */
.row{display:flex;gap:32px;padding:44px 64px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:active{background:var(--paper-2)}
.row-rank{width:64px;flex:none;font-size:40px;line-height:56px;font-weight:700;color:var(--ink-4);padding-top:4px}
.row-rank.top{color:var(--ink)}
.row-main{flex:1;min-width:0}
.kicker{font-size:24px;line-height:40px;color:var(--ink-3);display:flex;gap:16px;align-items:center;margin-bottom:8px}
.kicker .sep{width:1px;height:22px;background:var(--line)}
.row-title{font-size:40px;line-height:56px;font-weight:600;color:var(--ink);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-ex{font-size:32px;line-height:52px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{font-size:24px;line-height:40px;color:var(--ink-3);margin-top:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* 状态标签 48 高 */
.tag{display:inline-flex;align-items:center;height:48px;padding:0 16px;border:1px solid var(--line);font-size:24px;line-height:1;font-weight:600;color:var(--ink-3);white-space:nowrap;letter-spacing:.02em}
.tag.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.warn{border-color:var(--ink-3);color:var(--ink-2)}

/* ---------- 问题页 ---------- */
.qhead{flex:none;padding:36px 64px 32px;border-bottom:1px solid var(--line-strong)}
.qhead h1{font-size:44px;line-height:62px;font-weight:700;margin-bottom:16px}
.qhead .qex{font-size:30px;line-height:48px;color:var(--ink-2);margin-bottom:18px}
.qhead .qmeta{font-size:24px;line-height:40px;color:var(--ink-3);display:flex;gap:18px;align-items:center}
.ansrow{display:flex;gap:0;flex-direction:column;padding:40px 64px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.ansrow:active{background:var(--paper-2)}
.ansrow .who{display:flex;align-items:baseline;gap:16px;margin-bottom:10px}
.ansrow .who b{font-size:32px;line-height:48px;font-weight:600}
.ansrow .who span{font-size:24px;color:var(--ink-3);line-height:40px}
.ansrow .ex{font-size:32px;line-height:52px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ansrow .foot{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.ansrow .foot .n{font-size:24px;color:var(--ink-3);line-height:40px}

/* 加载更多 */
.morebar{padding:40px 64px 64px}
.morebtn{
  width:100%;height:112px;background:var(--paper);border:1px solid var(--ink);color:var(--ink);
  font:inherit;font-size:30px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;
}
.morebtn:active{background:var(--paper-2)}
.batchend{text-align:center;color:var(--ink-4);font-size:24px;line-height:40px;padding:8px 0 0}

/* ---------- 阅读页 ---------- */
.readbar{height:140px;flex:none;display:flex;align-items:center;padding:0 24px 0 16px;border-bottom:1px solid var(--line);gap:4px}
.readbar .ttl{flex:1;font-size:30px;font-weight:600;color:var(--ink-3);padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aa{width:96px;height:88px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:inherit;font-size:32px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;margin-right:8px}
.aa:active{background:var(--paper-2)}

.article{padding:24px 64px 96px}
.article .src{font-size:24px;line-height:40px;color:var(--ink-3);display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.article h1{font-size:48px;line-height:66px;font-weight:700;letter-spacing:-.005em;margin-bottom:28px}
.byline{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:36px}
.byline .who b{font-size:32px;font-weight:600;display:block;line-height:48px}
.byline .who span{font-size:24px;color:var(--ink-3);line-height:40px;display:block}
.article p{font-size:calc(38px * var(--fs));line-height:var(--lh);color:var(--ink);margin-bottom:calc(30px * var(--fs));text-align:justify}
.article .statehint{
  border:1px solid var(--line);padding:24px 28px;margin-bottom:34px;font-size:26px;line-height:42px;color:var(--ink-2);
  display:flex;gap:16px;align-items:flex-start;
}
.article .statehint b{color:var(--ink);font-weight:700;white-space:nowrap}
.article .end{text-align:center;color:var(--ink-4);font-size:24px;line-height:40px;margin-top:26px;letter-spacing:.14em}

/* 底部操作栏 132 */
.actionbar{height:132px;flex:none;display:flex;border-top:1px solid var(--line-strong);background:var(--paper)}
.ab{
  flex:1;background:none;border:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--ink);font:inherit;font-size:23px;font-weight:600;cursor:pointer;padding:0 6px;
}
.ab:last-child{border-right:0}
.ab svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ab .k{line-height:1;white-space:nowrap}
.ab:active{background:var(--paper-2)}
.ab[disabled]{color:var(--ink-4);cursor:default}
.ab.primary{color:var(--ink)}

/* ---------- 评论 ---------- */
.chead{height:120px;flex:none;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--line)}
.chead .ttl{flex:1;font-size:32px;font-weight:600}
.chead .ttl em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:26px;margin-left:12px}
.cmt{padding:40px 64px;border-bottom:1px solid var(--line)}
.cmt .who{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.cmt .who b{font-size:32px;line-height:48px;font-weight:600}
.cmt .who span{font-size:24px;color:var(--ink-3);line-height:40px}
.cmt .txt{font-size:34px;line-height:58px;color:var(--ink);margin-bottom:18px}
.cmt .bar{display:flex;align-items:center;gap:32px;font-size:24px;color:var(--ink-3);line-height:40px}
.cmt .bar button{background:none;border:0;font:inherit;color:var(--ink-3);cursor:pointer;padding:12px 0;font-size:24px}
.cmt .bar button:active{color:var(--ink)}
.kids{margin-top:22px;padding-left:44px;border-left:1px solid var(--line)}
.kid{padding:20px 0 22px;border-bottom:1px solid var(--line);cursor:pointer}
.kid:last-of-type{border-bottom:0}
.kid p{font-size:30px;line-height:52px;color:var(--ink-2)}
.kid .rto{font-weight:600;color:var(--ink)}
.kid .rmeta{font-size:24px;line-height:40px;color:var(--ink-4);margin-top:6px}
.allrep{
  display:inline-flex;align-items:center;gap:12px;margin-top:20px;font-size:26px;font-weight:600;color:var(--ink);
  background:none;border:0;border-top:1px solid var(--line);padding:22px 0 0;cursor:pointer;width:100%;text-align:left;
}
.allrep svg{width:28px;height:28px}

/* ---------- 子回复全屏页 ---------- */
.parentbox{margin:0 64px 8px;border:1px solid var(--line);padding:32px 36px;background:var(--paper-2)}
.parentbox .who{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.parentbox .who b{font-size:30px;font-weight:600;line-height:44px}
.parentbox .who span{font-size:24px;color:var(--ink-3);line-height:40px}
.parentbox p{font-size:30px;line-height:50px;color:var(--ink-2)}
.pagent{padding:26px 64px;font-size:24px;line-height:40px;color:var(--ink-3);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}
.rep{padding:34px 64px;border-bottom:1px solid var(--line)}
.rep .who{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.rep .who b{font-size:30px;font-weight:600;line-height:44px}
.rep .who span{font-size:24px;color:var(--ink-3);line-height:40px}
.rep p{font-size:32px;line-height:54px;color:var(--ink);margin-top:4px}
.rep .rmeta{font-size:24px;line-height:40px;color:var(--ink-4);margin-top:10px}

/* ---------- 离线页 ---------- */
.offgroup{padding:36px 64px 0}
.offgroup .gt{font-size:26px;letter-spacing:.1em;color:var(--ink-3);font-weight:600;padding-bottom:16px;border-bottom:1px solid var(--line-strong);margin-bottom:8px;display:flex;justify-content:space-between}
.offgroup .gt span{letter-spacing:0;font-weight:400}
.offrow{display:flex;gap:24px;padding:26px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.offrow .t{flex:1;font-size:32px;line-height:50px;font-weight:500}
.offrow .m{font-size:24px;line-height:40px;color:var(--ink-3);margin-top:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* ---------- 空状态 ---------- */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 120px;text-align:center;gap:24px}
.empty .big{font-size:36px;font-weight:600;line-height:56px}
.empty p{font-size:28px;line-height:48px;color:var(--ink-3)}
.empty .acts{display:flex;gap:20px;margin-top:12px}

/* ---------- 直答 ---------- */
.direct{padding:48px 64px 64px}
.direct .lbl{font-size:24px;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-bottom:18px}
.direct textarea{
  width:100%;height:260px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);
  font:inherit;font-size:34px;line-height:56px;padding:26px 28px;resize:none;outline:none;
}
.direct textarea::placeholder{color:var(--ink-4)}
.models{display:flex;gap:16px;margin:32px 0 40px;flex-wrap:wrap}
.model{border:1px solid var(--line);color:var(--ink-3);font-size:26px;padding:18px 28px;cursor:pointer;background:var(--paper);font-family:inherit}
.model.on{border-color:var(--ink);color:var(--ink);font-weight:700;border-width:2px;padding:17px 27px}
.direct .note{font-size:24px;line-height:42px;color:var(--ink-3);margin-top:28px;display:flex;gap:14px}
.aihint{border:1px solid var(--ink-3);padding:20px 26px;font-size:26px;line-height:40px;color:var(--ink-2);margin-bottom:34px;display:flex;gap:14px;align-items:center}

/* ---------- 设置 ---------- */
.setgroup{padding:36px 64px 8px}
.setgroup .gt{font-size:26px;letter-spacing:.1em;font-weight:600;color:var(--ink-3);padding-bottom:14px;border-bottom:1px solid var(--line-strong);margin-bottom:4px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:32px 0;border-bottom:1px solid var(--line);min-height:112px}
.setrow .k{font-size:32px;line-height:48px;font-weight:500}

function statusTag(a){
  if(a.status === 'full') return '<span class="tag solid">已取得正文</span>';
  if(a.status === 'cached') return '<span class="tag solid">缓存正文</span>';
  if(a.status === 'limited') return '<span class="tag warn">正文受限</span>';
  return '<span class="tag">仅摘要</span>';
}

function homeRow(q, i, kind){
  const top = i === 0 ? ' top' : '';
  return `
  <article class="row" data-action="open-q" data-id="${q.id}">

function viewHome(){
  const tab = state.tab;

  if(tab === 'direct') return homeHead() + viewDirect();
  if(tab === 'offline') return homeHead() + viewOffline();

  const baseList = tab === 'recommend' ? QUESTIONS.slice(2).concat(QUESTIONS.slice(0,2)) : QUESTIONS;
  const shift = tab === 'recommend' ? (state.batchNo - 1) % baseList.length : 0;
  const list = baseList.slice(shift).concat(baseList.slice(0, shift));
  const cacheLabel = tab === 'recommend'
    ? `缓存 ${state.cacheTime} · 第 ${state.batchNo} 批`
    : `缓存 ${state.cacheTime} · ${list.length} 条`;

  const pager = tab === 'recommend' ? `
    <div class="pager">
      <button data-action="batch-prev" ${state.batchNo<=1?'disabled':''}>‹ 上一批</button>
      <div class="mid">第 ${state.batchNo} / 6 批</div>
      <button data-action="batch-next" ${state.batchNo>=6?'disabled':''}>下一批 ›</button>
    </div>` : '';

  const empty = state.empty && tab === 'hot';

  return homeHead() + `
    <div class="cachebar">
      <span class="meta">${empty ? '本机暂无缓存 · 尚未联网' : cacheLabel}</span>
      <button class="ghostbtn" data-action="refresh-content">${I.refresh}${empty?'联网刷新':'刷新内容'}</button>
    </div>
    ${state.banner ? bannerHTML() : ''}

      <div class="empty">
        <div class="big">还没有缓存内容</div>
        <p>第一次启动不等待网络，直接显示本机缓存。当前没有可用内容，可以主动联网刷新一次；隧道里没有信号时会停在这一页。</p>

          <button class="ghostbtn" data-action="open-settings">查看设置</button>
        </div>
      </div>`
    : `<div class="scroll" id="scroller">
      ${list.map((q,i)=>homeRow(q,i,tab==='recommend'?'推荐':null)).join('')}
      <div class="morebar">
        <div class="batchend">已到本批末尾 · 刷新内容获取更多</div>
      </div>
    </div>`}`;
}

function viewReading(qid, aid){
  const q = qById(qid);
  const a = q.answers.find(x=>x.id===aid) || q.answers[0];
  const idx = q.answers.indexOf(a);
  const mode = state.read.mode;
  const isFull = a.status === 'full' || a.status === 'cached';

  let hint = '';
  if(a.status === 'limited'){
    hint = `<div class="statehint"><b>正文不可用</b><span>${a.reason || '该回答需要更高权限，已保留摘要。'}</span></div>`;
  } else if(!isFull){
    hint = `<div class="statehint"><b>仅摘要</b><span>尚未取得正文。可点底栏「看全文」发起请求；失败时会继续显示摘要，不会冒充完整回答。</span></div>`;
  } else if(mode === 'excerpt'){
    hint = `<div class="statehint"><b>摘要视图</b><span>这是接口返回的摘要，不是完整正文。点底栏「看正文」切回。</span></div>`;
  }

  const paras = (mode === 'excerpt' || !isFull)
    ? `<p>${a.excerpt}</p>`
    : a.body.map(p=>`<p>${p}</p>`).join('');

  const midLabel = (mode === 'excerpt' || !isFull) ? '看全文' : '看摘要';
  const midIcon = (mode === 'excerpt' || !isFull) ? I.text : I.doc;

  return `
  <div class="readbar">
    <button class="iconbtn" data-action="back">${I.back}</button>
    <div class="ttl">回答 · ${a.author}</div>
    <button class="aa" data-action="open-sheet" aria-label="阅读设置">Aa</button>
  </div>
  ${state.banner ? bannerHTML() : ''}
  <div class="scroll" id="scroller">
    <div class="article">
      <div class="src">
        <span>问题</span><span>·</span><span>${a.got}</span><span>·</span><span>第 ${idx+1} / ${q.answers.length} 条回答</span>
      </div>
      <h1>${q.title}</h1>
      <div class="byline">
        <div class="who">
          <b>${a.author}</b>
          <span>${a.badge ? a.badge + ' · ' : ''}${a.votes} 赞同</span>
        </div>
        ${statusTag(a)}
      </div>
      ${hint}
      ${paras}
      <div class="end">· 回答结束 ·</div>
    </div>
  </div>
  <div class="actionbar">
    <button class="ab" data-action="prev-a">${I.prev}<span class="k">上一条</span></button>
    <button class="ab" data-action="open-comments">${I.comment}<span class="k">评论 ${a.comments}</span></button>
    <button class="ab" data-action="toggle-mode">${midIcon}<span class="k">${midLabel}</span></button>
    <button class="ab" data-action="refresh-body">${I.refresh}<span class="k">刷新正文</span></button>
    <button class="ab" data-action="next-a">${I.next}<span class="k">下一条</span></button>
  </div>`;
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  saveScroll();              // 就地重绘（如调字号）前先记住位置
  const v = cur();
  let html = '';
  if(v.view === 'home') html = viewHome();
  else if(v.view === 'question') html = viewQuestion(v.qid);
  else if(v.view === 'reading') html = viewReading(v.qid, v.aid);
  else if(v.view === 'comments') html = viewComments(v.qid, v.aid);
  else if(v.view === 'replies') html = viewReplies(v.page || 0);
  else if(v.view === 'settings') html = viewSettings();
  else if(v.view === 'login') html = viewLogin();
  else if(v.view === 'directResult') html = viewDirectResult();

  const dev = document.getElementById('device');
  dev.dataset.theme = state.prefs.dark ? 'dark' : 'light';
  dev.style.setProperty('--fs', FS_STEPS[state.prefs.fs]);
  dev.style.setProperty('--lh', LH_STEPS[state.prefs.lh]);
  app.innerHTML = html;
  shownKey = scrollKey();
  renderLayers();
  restoreScroll();
  const yParam = new URLSearchParams(location.search).get('y');
  if(yParam){
    const sc = document.getElementById('scroller');
    if(sc) sc.scrollTop = Number(yParam);
  }
  syncPanel();
}

function scrollKey(){
  const v = cur();
  if(v.view === 'home') return 'home:'+state.tab;
  return v.view+':'+(v.qid||'')+':'+(v.aid||'')+':'+((v.page)||0);
}

let shownKey = null;   // 当前 DOM 对应的滚动记录键

function saveScroll(){
  const sc = document.getElementById('scroller');
  if(sc && shownKey) state.scroll[shownKey] = sc.scrollTop;
}

function restoreScroll(){
  const sc = document.getElementById('scroller');
  if(!sc) return;
  const y = state.scroll[scrollKey()] || 0;
  sc.scrollTop = y;
}

function renderLayers(){
  let html = '';
  if(state.menu) html += menuHTML();
  if(state.sheet) html += sheetHTML();
  layers.innerHTML = html;
}

/* ============================================================
   交互
   ============================================================ */
function go(view){
  saveScroll();
  state.sheet = null;
  state.menu = null;
  state.stack.push(view);
  if(state.prefs.flash) inkFlash(90);
  render();
}

function back(){
  saveScroll();
  if(state.stack.length <= 1){
    state.stack = [{view:'home'}];
    state.tab = 'hot';
  } else {
    state.stack.pop();
  }
  state.sheet = null;
  state.menu = null;
  if(state.prefs.flash) inkFlash(70);
  render();
}

function setTab(t){
  saveScroll();
  if(t === state.tab && cur().view === 'home') return;
  state.tab = t;
  state.stack = [{view:'home'}];
  state.sheet = null;
  state.menu = null;
  if(state.prefs.flash) inkFlash(70);
  render();
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

function inkFlash(ms){
  flashEl.style.transition = 'none';
  flashEl.style.background = '#000';
  flashEl.style.opacity = '0.92';
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      flashEl.style.background = '#fff';
      setTimeout(()=>{
        flashEl.style.transition = 'opacity .10s linear';
        flashEl.style.opacity = '0';
      }, ms);
    }, 40);
  });
}

/* 阅读上下文 */
function readingCtx(){
  const q = qById(state.read.qid);
  return {q, a:q.answers[state.read.idx]};
}

function openReading(qid, aid, mode){
  const q = qById(qid);
  const i = Math.max(0, q.answers.findIndex(x=>x.id===aid));
  state.read = {qid, idx:i, mode:mode || ((q.answers[i].status==='full'||q.answers[i].status==='cached') ? 'body' : 'excerpt')};
  go({view:'reading', qid, aid:q.answers[i].id});
}

/* 事件委托 */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  switch(a){
    case 'tab': setTab(el.dataset.tab); return;
    case 'back': back(); return;

    case 'open-q': openQuestion(el.dataset.id); return;
    case 'open-a': openReading(el.dataset.q, el.dataset.a); return;
    case 'open-comments': go({view:'comments', qid:state.read.qid, aid:readingCtx().a.id}); return;
    case 'open-replies': go({view:'replies', page:0}); return;
    case 'next-page': go({view:'replies', page:Number(el.dataset.p)}); return;

    case 'open-sheet': state.sheet = true; renderLayers(); return;
    case 'close-sheet': state.sheet = null; renderLayers(); return;

    case 'prev-a': switchAnswer(-1); return;
    case 'next-a': switchAnswer(1); return;

    case 'toggle-mode': toggleMode(); return;
    case 'refresh-body': refreshBody(); return;

    case 'fs-minus':
      if(state.prefs.fs>0){ state.prefs.fs--; render(); }
      return;
    case 'fs-plus':
      if(state.prefs.fs<4){ state.prefs.fs++; render(); }
      return;
    case 'lh':
      state.prefs.lh = Number(el.dataset.i); render(); return;
    case 'light-minus':
      if(state.prefs.light>0){ state.prefs.light--; render(); }
      return;
    case 'light-plus':
      if(state.prefs.light<10){ state.prefs.light++; render(); }
      return;
    case 'policy':
      state.prefs.refreshPolicy = Number(el.dataset.i); render(); return;
    case 'toggle-dark':
      state.prefs.dark = !state.prefs.dark;
      inkFlash(120);
      render();
      return;
    case 'flash':
      inkFlash(340);
      toast('已全屏刷新，残影清除（未联网）');
      return;

    case 'refresh-content': refreshContent(el); return;
    case 'batch-prev':
      if(state.batchNo>1){ state.batchNo--; render(); }
      return;
    case 'batch-next':
      if(state.batchNo<6){ state.batchNo++; render(); }
      return;
    case 'close-banner': state.banner = null; render(); return;

    case 'more-answers': {
      const qid = el.dataset.q;
      state.batch[qid] = Math.min((state.batch[qid]||5)+3, qById(qid).answers.length);
      render();
      return;
    }

    case 'go-login': go({view:'login'}); return;
    case 'go-offline': saveScroll(); state.tab='offline'; state.stack=[{view:'home'}]; render(); return;
    case 'check-session':
      toast(state.offline ? '网络不可用，无法校验会话' : '会话仍被拒绝：需要重新导入');
      return;
    case 'logout-agent':
      toast('已清除本机会话（原型仅提示）');
      return;
    case 'open-offline': toast('打开缓存：' + el.dataset.t.slice(0,12) + '…'); return;

    case 'model':
      state.direct.model = Number(el.dataset.i); render(); return;
    case 'direct-submit': {
      const ta = document.getElementById('dq');
      if(ta) state.direct.q = ta.value.trim();
      if(state.offline){ toast('当前离线，直答需要网络'); return; }
      go({view:'directResult'});
      return;
    }
    case 'open-settings': go({view:'settings'}); return;

    case 'toast': toast(el.dataset.msg || '原型未实现'); return;

    case 'menu-read':
      state.menu = null;
      openReading(state.menuQ, state.menuA, 'excerpt');
      return;
    case 'menu-fetch': {
      const a = qById(state.menuQ).answers.find(x=>x.id===state.menuA);
      state.menu = null; renderLayers();
      if(a.status === 'limited') toast('正文不可用：该回答需要更高权限');
      else if(state.offline) toast('网络不可用，仍在显示摘要');
      else toast('正在请求正文… 成功后阅读页会显示「已取得正文」');
      return;
    }
    case 'menu-comments':
      state.menu = null;
      go({view:'comments', qid:state.menuQ, aid:state.menuA});
      return;
    case 'menu-link':
      state.menu = null; renderLayers();
      toast('链接已复制。Kindle 无浏览器时可生成二维码用手机打开');
      return;
    case 'close-menu': state.menu = null; renderLayers(); return;
  }
});

function openQuestion(qid){
  go({view:'question', qid});
}

function switchAnswer(dir){
  const q = qById(state.read.qid);
  const next = state.read.idx + dir;
  if(next < 0){ toast('已经是第一条回答'); return; }
  if(next >= q.answers.length){ toast('已经是最后一条回答'); return; }
  state.read.idx = next;
  state.read.mode = (q.answers[next].status==='full'||q.answers[next].status==='cached') ? 'body' : 'excerpt';
  const v = cur();
  v.aid = q.answers[next].id;
  state.scroll[scrollKey()] = 0;
  render();
  const sc = document.getElementById('scroller');
  if(sc) sc.scrollTop = 0;
}

function toggleMode(){
  const {a} = readingCtx();
  if(a.status === 'limited'){
    toast('正文不可用：' + (a.reason || '需要更高权限'));
    return;
  }
  if(a.status === 'excerpt'){
    if(state.offline){ toast('网络不可用，仍在显示摘要'); return; }
    toast('正在请求正文… 当前仍显示摘要');
    return;
  }
  state.read.mode = state.read.mode === 'body' ? 'excerpt' : 'body';
  render();
}

function refreshBody(){
  const {a} = readingCtx();
  if(state.offline){
    state.banner = {title:'刷新失败', text:'网络不可用，正在显示 '+state.cacheTime+' 的缓存。阅读位置已保留。'};
    render();
    return;
  }
  if(a.status === 'limited'){ toast('该回答正文受限，刷新不会改变结果'); return; }
  toast('正在刷新正文…');
  setTimeout(()=>{
    state.cacheTime = nowHM();
    toast('正文已更新 · ' + state.cacheTime);
    render();
  }, 900);
}

function refreshContent(el){
  if(state.offline){
    state.banner = {title:'刷新失败', text:'网络不可用。' + state.cacheTime + ' 的缓存仍可阅读，位置已保留。'};
    render();
    return;
  }
  const old = el.innerHTML;
  el.disabled = true;
  el.innerHTML = I.refresh + '刷新中…';
  setTimeout(()=>{
    state.cacheTime = nowHM();
    state.banner = null;
    state.empty = false;
    toast('已更新内容 · ' + state.cacheTime);
    render();
  }, 850);
}

function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* 长按 */
let pressTimer = null, longPressed = false;
app.addEventListener('pointerdown', (e)=>{
  const row = e.target.closest('[data-action="open-q"],[data-action="open-a"]');
  if(!row) return;
  longPressed = false;
  const qid = row.dataset.action === 'open-q' ? row.dataset.id : row.dataset.q;
  const aid = row.dataset.action === 'open-a' ? row.dataset.a : qById(qid).answers[0].id;
  pressTimer = setTimeout(()=>{
    longPressed = true;
    state.menuQ = qid; state.menuA = aid;
    state.menu = {title: qById(qid).title};
    renderLayers();
  }, 520);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  app.addEventListener(ev, ()=>{ clearTimeout(pressTimer); });
});
app.addEventListener('click', (e)=>{
  if(longPressed){ e.stopPropagation(); e.preventDefault(); longPressed = false; }
}, true);

/* 键盘 */
document.addEventListener('keydown', (e)=>{
  const v = cur();
  if(e.key === 'Escape'){
    if(state.sheet){ state.sheet = null; renderLayers(); return; }
    if(state.menu){ state.menu = null; renderLayers(); return; }
    back(); return;
  }
  if(v.view === 'reading'){
    if(e.key === 'ArrowLeft'){ switchAnswer(-1); }
    if(e.key === 'ArrowRight'){ switchAnswer(1); }
  }
});

/* ============================================================
   评审台
   ============================================================ */
function syncPanel(){
  document.querySelectorAll('#panel .sw').forEach(sw=>{
    const k = sw.dataset.p;
    let on = false;
    if(k === 'offline') on = state.offline;
    if(k === 'flash') on = state.prefs.flash;
    if(k === 'dark') on = state.prefs.dark;
    if(k === 'empty') on = state.empty;
    sw.classList.toggle('on', on);
  });
}

document.querySelectorAll('#panel .sw').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    const k = sw.dataset.p;
    if(k === 'offline'){
      state.offline = !state.offline;
      if(state.offline){
        state.banner = {title:'离线', text:'网络不可用。当前显示 '+state.cacheTime+' 的缓存，位置已保留。'};
      } else {
        state.banner = null;
        toast('网络已恢复，可刷新内容');
      }
      render();
    }
    if(k === 'flash'){ state.prefs.flash = !state.prefs.flash; syncPanel(); }
    if(k === 'dark'){ state.prefs.dark = !state.prefs.dark; inkFlash(120); render(); }
    if(k === 'empty'){
      state.empty = !state.empty;
      if(state.empty){ state.tab = 'hot'; state.stack = [{view:'home'}]; }
      render();
    }
  });
});

document.querySelectorAll('#panel [data-jump]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const j = btn.dataset.jump;
    state.sheet = null; state.menu = null;
    if(j === 'home'){ state.stack = [{view:'home'}]; state.tab = 'hot'; }
    if(j === 'question'){ state.stack = [{view:'home'},{view:'question', qid:'q1'}]; }
    if(j === 'reading'){ state.read = {qid:'q1', idx:0, mode:'body'}; state.stack = [{view:'home'},{view:'question', qid:'q1'},{view:'reading', qid:'q1', aid:'a1'}]; }
    if(j === 'comments'){ state.stack = [{view:'home'},{view:'question', qid:'q1'},{view:'reading', qid:'q1', aid:'a1'},{view:'comments', qid:'q1', aid:'a1'}]; }
    if(j === 'replies'){ state.stack = [{view:'home'},{view:'question', qid:'q1'},{view:'reading', qid:'q1', aid:'a1'},{view:'comments', qid:'q1', aid:'a1'},{view:'replies', page:0}]; }
    if(j === 'offline'){ state.stack = [{view:'home'}]; state.tab = 'offline'; }
    if(j === 'settings'){ state.stack = [{view:'home'},{view:'settings'}]; }
    if(j === 'login'){ state.stack = [{view:'home'},{view:'settings'},{view:'login'}]; }
    render();
  });
});

document.getElementById('btnFlash').addEventListener('click', ()=>{
  inkFlash(340);
  toast('已全屏刷新，残影清除（未联网）');
});

document.getElementById('btnReset').addEventListener('click', ()=>{
  state.tab = 'hot';
  state.stack = [{view:'home'}];
  state.batch = {};
  state.scroll = {};
  state.banner = null;
  state.offline = false;
  state.sheet = null;
  state.menu = null;
  state.read = {qid:'q1', idx:0, mode:'body'};
  state.direct = {q:'', model:0, result:false};
  state.prefs = {fs:2, lh:1, dark:false, light:6, flash:false, refreshPolicy:0};
  render();
});

/* ============================================================
   缩放适配
   ============================================================ */
function fit(){
  const solo = new URLSearchParams(location.search).has('solo');
  const panel = document.getElementById('panel');
  const stage = document.getElementById('stage');
  panel.style.display = solo ? 'none' : '';
  stage.style.paddingLeft = solo ? '0' : '300px';
  const pad = solo ? 0 : 48;
  const availW = window.innerWidth - (solo ? 0 : 300) - pad*2;
  const availH = window.innerHeight - pad*2;
  const s = Math.min(availW/1072, availH/1448, 1);
  document.getElementById('device').style.transform = 'scale('+s+')';
  document.getElementById('deviceWrap').style.width = (1072*s)+'px';
  document.getElementById('deviceWrap').style.height = (1448*s)+'px';
}
window.addEventListener('resize', fit);

/* 通过地址栏直达某一屏，便于评审与截图 */
function bootFromHash(){
  const h = (location.hash || '').replace('#','');
  if(!h) return;
  const dark = h.endsWith('-dark');
  const key = h.replace('-dark','');
  if(dark) state.prefs.dark = true;

  const base = [{view:'home'}];
  const map = {
    hot:        ()=>{state.tab='hot'; state.stack=base;},
    recommend:  ()=>{state.tab='recommend'; state.stack=base;},
    offline:    ()=>{state.tab='offline'; state.stack=base; state.offline=true; state.banner={title:'离线',text:'网络不可用。当前显示 20:41 的缓存，位置已保留。'};},
    direct:     ()=>{state.tab='direct'; state.stack=base;},
    question:   ()=>{state.stack=[{view:'home'},{view:'question', qid:'q1'}];},
    reading:    ()=>{state.read={qid:'q1',idx:0,mode:'body'}; state.stack=[{view:'home'},{view:'question',qid:'q1'},{view:'reading',qid:'q1',aid:'a1'}];},
    excerpt:    ()=>{state.read={qid:'q1',idx:1,mode:'excerpt'}; state.stack=[{view:'home'},{view:'question',qid:'q1'},{view:'reading',qid:'q1',aid:'a2'}];},
    limited:    ()=>{state.read={qid:'q1',idx:2,mode:'excerpt'}; state.stack=[{view:'home'},{view:'question',qid:'q1'},{view:'reading',qid:'q1',aid:'a3'}];},
    comments:   ()=>{state.stack=[{view:'home'},{view:'question',qid:'q1'},{view:'reading',qid:'q1',aid:'a1'},{view:'comments',qid:'q1',aid:'a1'}];},
    replies:    ()=>{state.stack=[{view:'home'},{view:'question',qid:'q1'},{view:'reading',qid:'q1',aid:'a1'},{view:'comments',qid:'q1',aid:'a1'},{view:'replies',page:0}];},
    settings:   ()=>{state.stack=[{view:'home'},{view:'settings'}];},
    login:      ()=>{state.stack=[{view:'home'},{view:'settings'},{view:'login'}];},
    sheet:      ()=>{state.read={qid:'q1',idx:0,mode:'body'}; state.stack=[{view:'home'},{view:'reading',qid:'q1',aid:'a1'}]; state.sheet=true;},
    result:     ()=>{state.direct.q='通勤时间适合读什么？'; state.stack=[{view:'home'},{view:'directResult'}]; state.tab='direct';},
    menu:       ()=>{state.stack=[{view:'home'}]; state.menuQ='q1'; state.menuA='a1'; state.menu={title:'为什么越来越多人在地铁上读长文章，而不是刷短视频？'};},
    empty:      ()=>{state.tab='hot'; state.stack=base; state.empty=true;}
  };
  const fn = map[key] || function(){};
  fn();
  if(h.endsWith('-offline')){ state.offline = true; state.banner = {title:'离线', text:'网络不可用。当前显示 20:41 的缓存，位置已保留。'}; }
}

bootFromHash();
fit();
render();
</script>
